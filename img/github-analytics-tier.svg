<svg width="900" height="230" viewBox="0 0 900 230" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">GitHub Analytics Tier</title>
  <desc id="desc">A stable GitHub analytics tier card for hafifradhitya.</desc>
  <rect width="900" height="230" rx="14" fill="#0d1117"/>
  <rect x="1" y="1" width="898" height="228" rx="13" stroke="#30363d" stroke-width="2"/>
  <text x="42" y="52" fill="#58a6ff" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">GitHub Analytical Tier</text>
  <text x="42" y="86" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="15">Public profile signal based on repositories, contribution activity, and consistency.</text>

  <g transform="translate(42 120)">
    <rect width="210" height="70" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="28" y="44" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">C</text>
    <text x="70" y="30" fill="#c9d1d9" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Starter</text>
    <text x="70" y="52" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="13">Building foundation</text>
  </g>

  <g transform="translate(345 104)">
    <rect width="210" height="94" rx="12" fill="#102a43" stroke="#58a6ff" stroke-width="2"/>
    <text x="27" y="59" fill="#58a6ff" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="800">B</text>
    <text x="77" y="40" fill="#f0f6fc" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Active Builder</text>
    <text x="77" y="65" fill="#c9d1d9" font-family="Segoe UI, Arial, sans-serif" font-size="13">30 repos / 319 contributions</text>
    <text x="77" y="84" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="12">Current tier highlight</text>
  </g>

  <g transform="translate(648 120)">
    <rect width="210" height="70" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="27" y="44" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">A</text>
    <text x="70" y="30" fill="#c9d1d9" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">High Impact</text>
    <text x="70" y="52" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="13">More consistency ahead</text>
  </g>
</svg>
